[project]
name = "szkolenie-pandas"
version = "0.1.0"
description = "Szkolenie: Python Pandas - analiza i wizualizacja danych - materiały ze szkolenia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=0.10.0",
    "faker>=24.0.0",
    "jupyterlab>=4.1.0",
    "matplotlib>=3.8.0",
    "notebook>=7.1.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "pyarrow>=15.0.0",
    "seaborn>=0.13.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
